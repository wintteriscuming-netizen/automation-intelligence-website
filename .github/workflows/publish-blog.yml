name: Build and publish blog
on:
  push:
    branches: [main]
    paths: ["content/**", "templates/**", "scripts/**"]
  schedule:
    - cron: "30 3 * * *"   # 09:00 AM IST daily (may run up to ~30 min late)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: blog-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pyyaml
      - run: python scripts/build_blog.py
      - name: Commit generated files
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Build blog [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Request Pages build
        if: steps.commit.outputs.changed == 'true'
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
